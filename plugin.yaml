name: slack-multiplayer-enhancements
version: 0.2.0
description: Bare silence markers never post the warning; inbound @mentions keep their target as "@name (UID)" and "@name (you)"; channel messages addressed to someone else are ignored; untagged replies in threads the bot posted in wake it; mid-turn messages in shared chats name their sender, and gateway notices name nobody; thread history uses the same mention format; a judge refused by its provider pauses /goal with that reason; the Slack session prompt names the current channel id; Slack plan cards show plain task labels, no args or error text, and vanish on silent turns.
author: QuillDev
