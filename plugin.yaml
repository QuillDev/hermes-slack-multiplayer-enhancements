name: slack-multiplayer-enhancements
version: 0.2.3
description: Bare silence markers never post the warning; inbound @mentions keep their target as "@name (UID)" and "@name (you)"; channel messages addressed to someone else are ignored; untagged replies in threads the bot posted in wake it; mid-turn messages in shared chats name their sender, and gateway notices name nobody; thread history uses the same mention format; a judge refused by its provider pauses /goal with that reason; the Slack session prompt names the current channel id; Slack plan cards (only inside threads) show plain task labels, no args or error text, and vanish on silent turns; an edit to an old Slack message never posts the "already received a different message" warning; Slack's status line names each step plainly and replaces the eyes in DMs and threads (top-level channel messages keep the eyes); a message the bot only overhears shows no status until the bot starts working.
author: QuillDev
